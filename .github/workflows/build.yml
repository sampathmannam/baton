name: Baton Android CI

# v1.9.7 (CI-002): CodeRabbit review caught that the workflow had
# no `permissions` block. Restrict GITHUB_TOKEN to read-only at the
# top level, and pass `persist-credentials: false` to every
# `actions/checkout` step so the token isn't written to the local
# git config (gradle executes repo code on the self-hosted runner
# and a compromised build could otherwise exfiltrate the token).
permissions:
  contents: read

on:
  push:
    branches: [main, master, 'm0/**', 'work/**', 'chore/**', 'fix/**', 'docs/**', 'test/**']
    tags: ['v*']
  pull_request:
    branches: [main, master, 'm0/**']

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  # macOS runners don't set ANDROID_HOME / JAVA_HOME the way the
  # developer's local shell does. The setup-android + setup-java
  # steps below write to $GITHUB_ENV; we source them via the gradle
  # invocation rather than re-exporting here.

jobs:
  unit-test:
    name: Unit tests (testDebugUnitTest)
    runs-on: [self-hosted, macOS, ARM64, baton]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          # v1.9.7: persist-credentials: false — see the top-level
          # `permissions` block comment for the rationale.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The developer's Mac (the runner host) already has a full
      # Android SDK at $HOME/Library/Android/sdk with all the
      # platforms and build-tools the project needs. The CI just
      # exports ANDROID_HOME; no setup-android action is required.
      # (android-actions/setup-android@v3 ignores ANDROID_HOME and
      # re-downloads the SDK to ~/.android/sdk, which adds ~10 min
      # of install time on a slow link.)
      - name: Export Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          test -d "$HOME/Library/Android/sdk" || (echo "::error::No SDK at $HOME/Library/Android/sdk" && exit 1)
          echo "Android SDK at $HOME/Library/Android/sdk OK"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          # v1.9.7: do NOT cache `app/build` — the test-results and
          # html reports inside grow to 100+ MB and the cache upload
          # step exceeds the 30-minute job timeout. The `~/.gradle/caches`
          # and `~/.gradle/wrapper` paths alone give ~95% of the speedup.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # v1.9.7 (CI-001): Robolectric upgraded from 4.13 -> 4.14.1
      # to fix the runOnMainThread hang on JDK 17 + ARM64 Mac
      # (MethodCallProxy.apply park). 4.14.1 changelog has the
      # fix. If the hang returns, this is the line to investigate.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace -PBATON_SUPABASE_URL=https://placeholder.supabase.co -PBATON_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci-only

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  lint:
    name: Kotlin lint (ktlint + detekt if present)
    runs-on: [self-hosted, macOS, ARM64, baton]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Export Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          test -d "$HOME/Library/Android/sdk" || (echo "::error::No SDK at $HOME/Library/Android/sdk" && exit 1)

      # v1.9.7 (CI-003): CodeRabbit review caught the `|| echo`
      # below — that swallows every gradle failure (including gradle
      # itself crashing, SDK download errors, ktlint not installed)
      # and reports the lint job as green. The intent was "warn on
      # lint issues but pass on build errors"; the right tool is
      # `continue-on-error: true` on the lint step, with the upload
      # step still conditional on `always()`. That way gradle's exit
      # code is preserved when a real error happens, but ktlint
      # warnings don't fail the job.
      - name: Run Android lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon -PBATON_SUPABASE_URL=https://placeholder.supabase.co -PBATON_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci-only

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

  assemble:
    name: Assemble debug APK
    runs-on: [self-hosted, macOS, ARM64, baton]
    timeout-minutes: 30
    needs: [unit-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Export Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          test -d "$HOME/Library/Android/sdk" || (echo "::error::No SDK at $HOME/Library/Android/sdk" && exit 1)

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -PBATON_SUPABASE_URL=https://placeholder.supabase.co -PBATON_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci-only

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
